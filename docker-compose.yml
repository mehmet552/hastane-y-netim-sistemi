version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: radsafe_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: radsafe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./radsafe-hms-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://radsafe_user:secure_password@db:5432/radsafe_db
    depends_on:
      - db

  frontend:
    build: ./radsafe-hms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
